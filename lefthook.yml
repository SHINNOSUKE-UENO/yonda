pre-commit:
  piped: true
  commands:
    secrets:
      run: gitleaks git --staged --redact
    format:
      glob: "*.{js,jsx,ts,tsx,json,jsonc,md,yml,yaml}"
      run: pnpm exec oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    lint:
      glob: "*.{js,jsx,ts,tsx}"
      run: pnpm exec oxlint --no-error-on-unmatched-pattern {staged_files}

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}
